<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>RRR Live Scores</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#060d18;color:#ccd;font-family:'Rajdhani','Segoe UI',sans-serif;min-height:100vh;}
.hdr{background:linear-gradient(135deg,#020a14,#0a1f35);border-bottom:2px solid #0d3060;padding:14px 14px 0;}
.title{font-family:'Bebas Neue',cursive;font-size:22px;letter-spacing:4px;color:#00c2ff;line-height:1;}
.sub{font-size:10px;color:#446;letter-spacing:3px;margin-top:2px;}
.dot{display:inline-block;width:7px;height:7px;background:#00e676;border-radius:50%;margin-right:4px;animation:pulse 1.2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
.tabs{display:flex;margin-top:12px;}
.tab{background:transparent;border:none;border-bottom:3px solid transparent;color:#446;padding:9px 14px;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;}
.tab.active{background:linear-gradient(135deg,#0d3060,#0a2040);border-bottom-color:#00c2ff;color:#00c2ff;}
.content{max-width:700px;margin:0 auto;padding:14px 12px;}
.sec{font-family:'Bebas Neue',cursive;font-size:15px;letter-spacing:4px;margin-bottom:10px;}
/* Court card */
.court-card{border-radius:14px;padding:14px 16px;margin-bottom:14px;border-width:2px;border-style:solid;}
.court-label{font-family:'Bebas Neue',cursive;font-size:20px;letter-spacing:4px;margin-bottom:10px;}
.match-info{font-size:11px;color:#446;letter-spacing:1px;margin-bottom:8px;}
.score-row{display:flex;align-items:center;gap:8px;}
.tb{flex:1;text-align:center;}
.tn{font-size:13px;font-weight:700;margin-bottom:2px;}
.pn{font-size:10px;color:#446;line-height:1.4;margin-bottom:4px;min-height:28px;}
.sn{font-family:'Bebas Neue',cursive;font-size:58px;line-height:1;}
.prog{display:flex;height:4px;border-radius:2px;overflow:hidden;margin-top:10px;background:#1a2a3a;}
.deuce-view{background:linear-gradient(135deg,#1a0a00,#2a1400);border:1.5px solid #ff9800;border-radius:8px;padding:8px 12px;text-align:center;margin:8px 0;animation:df 1s infinite;}
@keyframes df{0%,100%{border-color:#ff9800;}50%{border-color:#ffcc02;box-shadow:0 0 14px rgba(255,204,0,0.3);}}
.deuce-t{font-family:'Bebas Neue',cursive;font-size:22px;letter-spacing:5px;color:#ff9800;}
/* Idle court */
.idle-court{border-radius:14px;padding:14px 16px;margin-bottom:14px;background:#0a1628;border:1.5px solid #1a2a3a;}
/* Standings */
.stbl{width:100%;border-collapse:collapse;font-size:12px;}
.stbl th{padding:7px 8px;color:#00c2ff;font-weight:700;letter-spacing:1px;border-bottom:2px solid #0d2040;}
.stbl td{padding:6px 8px;border-bottom:1px solid #1a2a3a;}
.qb{background:#003322;color:#00e676;border-radius:4px;padding:2px 5px;font-size:10px;font-weight:700;}
/* KO */
.ko-card{border-radius:12px;padding:13px 14px;margin-bottom:10px;}
.set-done{background:#071a0e;border:1px solid #1a4a2a;border-radius:7px;padding:6px 11px;margin-bottom:5px;font-size:11px;color:#00e676;font-weight:700;}
/* Champion */
.champ{background:linear-gradient(135deg,#1a1000,#2a1a00);border:2px solid #ffd700;border-radius:14px;padding:22px;text-align:center;margin-bottom:18px;box-shadow:0 0 28px rgba(255,215,0,0.2);}
/* Teams */
.team-view{background:linear-gradient(135deg,#0d1b2a,#112035);border:1px solid #1a3060;border-radius:11px;padding:12px 14px;margin-bottom:9px;}
.empty{text-align:center;padding:48px 20px;color:#334;}
</style>
</head>
<body>
<div id="app"><div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#446;font-size:12px;letter-spacing:2px"><span class="dot"></span>CONNECTING...</div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getDatabase,ref,onValue}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
const FC={apiKey:"AIzaSyBYKxzFoQAKKddALIDqtHtsKqlQkes3ax4",authDomain:"rrr-tournamet.firebaseapp.com",databaseURL:"https://rrr-tournamet-default-rtdb.firebaseio.com",projectId:"rrr-tournamet",storageBucket:"rrr-tournamet.firebasestorage.app",messagingSenderId:"368535382395",appId:"1:368535382395:web:c72ef4b64648b60ec175de"};
const fb=initializeApp(FC),db=getDatabase(fb);
const LM=[{id:1,tA:"Team 1",tB:"Team 11",court:1,time:"10:00 AM"},{id:2,tA:"Team 13",tB:"Team 8",court:2,time:"10:00 AM"},{id:3,tA:"Team 5",tB:"Team 3",court:3,time:"10:00 AM"},{id:4,tA:"Team 15",tB:"Team 14",court:1,time:"10:15 AM"},{id:5,tA:"Team 16",tB:"Team 10",court:2,time:"10:15 AM"},{id:6,tA:"Team 2",tB:"Team 4",court:3,time:"10:15 AM"},{id:7,tA:"Team 1",tB:"Team 18",court:1,time:"10:30 AM"},{id:8,tA:"Team 13",tB:"Team 6",court:2,time:"10:30 AM"},{id:9,tA:"Team 5",tB:"Team 7",court:3,time:"10:30 AM"},{id:10,tA:"Team 15",tB:"Team 12",court:1,time:"10:45 AM"},{id:11,tA:"Team 16",tB:"Team 9",court:2,time:"10:45 AM"},{id:12,tA:"Team 2",tB:"Team 17",court:3,time:"10:45 AM"},{id:13,tA:"Team 11",tB:"Team 18",court:1,time:"11:00 AM"},{id:14,tA:"Team 8",tB:"Team 6",court:2,time:"11:00 AM"},{id:15,tA:"Team 3",tB:"Team 7",court:3,time:"11:00 AM"},{id:16,tA:"Team 14",tB:"Team 12",court:1,time:"11:15 AM"},{id:17,tA:"Team 10",tB:"Team 9",court:2,time:"11:15 AM"},{id:18,tA:"Team 4",tB:"Team 17",court:3,time:"11:15 AM"}];
const QF=[{id:"QF1",sA:"Q2",sB:"Q5",court:1,time:"11:30 AM"},{id:"QF2",sA:"Q4",sB:"Q3",court:2,time:"11:30 AM"},{id:"QF3",sA:"Q7",sB:"Q6",court:1,time:"11:50 AM"},{id:"QF4",sA:"Q1",sB:"Q8",court:2,time:"11:50 AM"}];
const SF=[{id:"SF1",sA:"W.QF1",sB:"W.QF2",court:1,time:"12:15 PM"},{id:"SF2",sA:"W.QF3",sB:"W.QF4",court:2,time:"12:15 PM"}];
const FN={id:"F1",sA:"W.SF1",sB:"W.SF2",court:1,time:"12:50 PM"};
const CC={1:"#00c2ff",2:"#ff6b35",3:"#00e676"};
const COURTS=[1,2,3];

let tab="live",ld={},kd={},td={};
onValue(ref(db,"league"),s=>{ld=s.val()||{};render();});
onValue(ref(db,"knockout"),s=>{kd=s.val()||{};render();});
onValue(ref(db,"teams"),s=>{td=s.val()||{};render();});

const gL=id=>ld[`m${id}`]||{sA:0,sB:0,confirmed:false,live:false,maxPts:21};
const gK=id=>kd[id]||{sets:[{a:0,b:0}],confirmed:false,live:false};
const gT=id=>td[`t${id}`]||{name:`Team ${id}`,p1:"",p2:"",p1avail:true,p2avail:true};
const tN=id=>gT(id).name||`Team ${id}`;
const tNum=s=>parseInt(s.split(" ")[1]);

function isDeuceActive(sA,sB,max){return sA>=(max-1)&&sB>=(max-1);}

function calcStandings(){
  const map={};for(let i=1;i<=18;i++)map[`Team ${i}`]={team:tN(i),wins:0,losses:0,pf:0,pa:0,diff:0,pts:0};
  LM.forEach(m=>{const s=gL(m.id);if(!s.confirmed)return;map[m.tA].pf+=s.sA;map[m.tA].pa+=s.sB;map[m.tB].pf+=s.sB;map[m.tB].pa+=s.sA;if(s.sA>s.sB){map[m.tA].wins++;map[m.tA].pts+=2;map[m.tB].losses++;}else{map[m.tB].wins++;map[m.tB].pts+=2;map[m.tA].losses++;}});
  Object.values(map).forEach(r=>r.diff=r.pf-r.pa);
  return Object.values(map).sort((a,b)=>b.pts-a.pts||b.diff-a.diff);
}
function gKT(slot){
  const q=calcStandings().slice(0,8);
  if(slot.startsWith("Q")){const r=parseInt(slot.slice(1))-1;return q[r]?.team||slot;}
  if(slot.startsWith("W.QF")){const id=slot.slice(2);const s=gK(id);if(!s.confirmed)return slot;const m=QF.find(x=>x.id===id);const w=s.sets.reduce((a,sv)=>{if(sv.confirmed){if(sv.a>sv.b)a.a++;else a.b++;}return a;},{a:0,b:0});return w.a>w.b?gKT(m.sA):gKT(m.sB);}
  if(slot.startsWith("W.SF")){const id=slot.slice(2);const s=gK(id);if(!s.confirmed)return slot;const m=SF.find(x=>x.id===id);const w=s.sets.reduce((a,sv)=>{if(sv.confirmed){if(sv.a>sv.b)a.a++;else a.b++;}return a;},{a:0,b:0});return w.a>w.b?gKT(m.sA):gKT(m.sB);}
  return slot;
}

function render(){
  const standings=calcStandings();
  const cc=LM.filter(m=>gL(m.id).confirmed).length;
  const liveLeague=LM.filter(m=>gL(m.id).live&&!gL(m.id).confirmed);
  const liveKO=[...QF,...SF,FN].filter(m=>gK(m.id).live&&!gK(m.id).confirmed);
  const liveCount=liveLeague.length+liveKO.length;
  const fKO=gK("F1");const fW=fKO.sets.reduce((a,sv)=>{if(sv.confirmed){if(sv.a>sv.b)a.a++;else a.b++;}return a;},{a:0,b:0});
  const champion=fKO.confirmed?(fW.a>fW.b?gKT(FN.sA):gKT(FN.sB)):null;

  document.getElementById("app").innerHTML=`
    <div class="hdr">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">
        <span style="font-size:26px">🏸</span>
        <div><div class="title">ROTARY RACQUET ROYALE</div><div class="sub"><span class="dot"></span>LIVE · ${liveCount} ACTIVE · ${cc}/18 LEAGUE DONE</div></div>
      </div>
      <div class="tabs">
        ${["live","standings","knockout","teams"].map(t=>`<button class="tab ${tab===t?"active":""}" data-tab="${t}">${t==="live"?"🟢 Live":t==="standings"?"📊 Standings":t==="knockout"?"🏆 Knockout":"👥 Teams"}</button>`).join("")}
      </div>
    </div>
    <div class="content">
      ${champion?`<div class="champ"><div style="font-size:34px">🏆</div><div style="font-family:'Bebas Neue',cursive;font-size:26px;color:#ffd700;letter-spacing:4px">CHAMPION</div><div style="font-size:20px;color:#fff;font-weight:700;margin-top:4px">${champion}</div></div>`:""}
      ${tab==="live"?rLive(liveLeague,liveKO,cc):tab==="standings"?rStandings(standings,cc):tab==="knockout"?rKnockout():rTeams()}
    </div>`;
  document.querySelectorAll("[data-tab]").forEach(el=>el.onclick=()=>{tab=el.dataset.tab;render();});
}

function rLive(liveLeague,liveKO,doneCount){
  let html="";

  // Show each court
  COURTS.forEach(courtNum=>{
    const cc=CC[courtNum];
    // Find live match on this court (league first, then KO)
    const lm=liveLeague.find(m=>m.court===courtNum);
    const km=liveKO.find(m=>m.court===courtNum);
    const active=lm||km;

    if(active){
      if(lm){
        // League match
        const s=gL(lm.id);
        const {sA=0,sB=0,maxPts=21}=s;
        const tAn=tN(tNum(lm.tA)),tBn=tN(tNum(lm.tB));
        const tAd=gT(tNum(lm.tA)),tBd=gT(tNum(lm.tB));
        const deuce=isDeuceActive(sA,sB,maxPts);
        html+=`<div class="court-card" style="background:linear-gradient(135deg,#0a1f0e,#0d2a18);border-color:${cc}">
          <div class="court-label" style="color:${cc}">🟢 COURT ${courtNum}</div>
          <div class="match-info">Match ${lm.id} · League · ${lm.time} · First to ${maxPts}</div>
          ${deuce?`<div class="deuce-view"><div class="deuce-t">🏸 DEUCE!</div><div style="font-size:10px;color:#a06000;margin-top:2px">Win by 2 consecutive points · Cap ${maxPts+9}</div></div>`:""}
          <div class="score-row">
            <div class="tb">
              <div class="tn" style="color:${sA>sB?deuce?"#ff9800":"#fff":"#778"}">${tAn}</div>
              <div class="pn">${tAd.p1?`<span style="color:${tAd.p1avail!==false?"#00e676":"#ff4444"}">●</span> ${tAd.p1}<br>`:""}${tAd.p2?`<span style="color:${tAd.p2avail!==false?"#00e676":"#ff4444"}">●</span> ${tAd.p2}`:""}</div>
              <div class="sn" style="color:${sA>sB?deuce?"#ff9800":"#fff":"#334"}">${sA}</div>
            </div>
            <div style="color:#223;font-weight:900;font-size:20px;padding-bottom:32px">–</div>
            <div class="tb">
              <div class="tn" style="color:${sB>sA?deuce?"#ff9800":"#fff":"#778"}">${tBn}</div>
              <div class="pn">${tBd.p1?`<span style="color:${tBd.p1avail!==false?"#00e676":"#ff4444"}">●</span> ${tBd.p1}<br>`:""}${tBd.p2?`<span style="color:${tBd.p2avail!==false?"#00e676":"#ff4444"}">●</span> ${tBd.p2}`:""}</div>
              <div class="sn" style="color:${sB>sA?deuce?"#ff9800":"#fff":"#334"}">${sB}</div>
            </div>
          </div>
          ${!deuce?`<div class="prog"><div style="width:${Math.min(50,(sA/maxPts)*100)}%;background:#00c2ff;border-radius:2px;transition:width 0.2s"></div><div style="flex:1"></div><div style="width:${Math.min(50,(sB/maxPts)*100)}%;background:#ff6b35;border-radius:2px;transition:width 0.2s"></div></div>`:""}
        </div>`;
      } else if(km){
        // KO match
        const ko=gK(km.id);
        const tA=gKT(km.sA),tB=gKT(km.sB);
        const sw=ko.sets.reduce((a,s)=>{if(s.confirmed){if(s.a>s.b)a.a++;else if(s.b>s.a)a.b++;}return a;},{a:0,b:0});
        const curSet=ko.sets.find(s=>!s.confirmed)||{a:0,b:0};
        const maxPts=ko.maxPts||15;
        const deuce=isDeuceActive(curSet.a,curSet.b,maxPts);
        html+=`<div class="court-card" style="background:linear-gradient(135deg,#0a1f0e,#0d2a18);border-color:${cc}">
          <div class="court-label" style="color:${cc}">🟢 COURT ${courtNum}</div>
          <div class="match-info">${km.id} · ${km.time} · Best of 3 · ${maxPts} pts/set</div>
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
            <div style="flex:1"><div class="tn">${tA}</div><div style="font-size:10px;color:#445;margin-top:2px">sets won</div></div>
            <div style="display:flex;align-items:center;gap:10px">
              <span style="font-family:'Bebas Neue',cursive;font-size:40px;color:${sw.a>sw.b?"#fff":"#334"}">${sw.a}</span>
              <span style="color:#223;font-size:18px;font-weight:900">–</span>
              <span style="font-family:'Bebas Neue',cursive;font-size:40px;color:${sw.b>sw.a?"#fff":"#334"}">${sw.b}</span>
            </div>
            <div style="flex:1;text-align:right"><div class="tn">${tB}</div><div style="font-size:10px;color:#445;margin-top:2px">sets won</div></div>
          </div>
          ${deuce?`<div class="deuce-view"><div class="deuce-t">🏸 DEUCE!</div><div style="font-size:10px;color:#a06000;margin-top:2px">Current set · Win by 2 consecutive</div></div>`:""}
          <div style="font-size:11px;color:#445;margin-bottom:6px">CURRENT SET: ${curSet.a} – ${curSet.b}</div>
          ${ko.sets.filter(s=>s.confirmed).map((s,i)=>`<div class="set-done">Set ${i+1}: ${s.a>s.b?tA:tB} wins ${s.a}–${s.b}</div>`).join("")}
        </div>`;
      }
    } else {
      // No active match on this court — show next upcoming
      const nextLeague=LM.filter(m=>!gL(m.id).confirmed&&!gL(m.id).live&&m.court===courtNum);
      const nextKO=[...QF,...SF,FN].filter(m=>!gK(m.id).confirmed&&!gK(m.id).live&&m.court===courtNum);
      const next=nextLeague[0]||nextKO[0];
      html+=`<div class="idle-court">
        <div style="font-family:'Bebas Neue',cursive;font-size:18px;letter-spacing:4px;color:#2a3a4a;margin-bottom:6px">⏸ COURT ${courtNum}</div>
        ${next?`<div style="font-size:12px;color:#334">Next: ${next.id?next.id:`Match ${next.id}`} at ${next.time}</div>`:`<div style="font-size:12px;color:#2a3a4a">No upcoming matches</div>`}
      </div>`;
    }
  });

  // Recently completed
  const recent=LM.filter(m=>gL(m.id).confirmed).slice(-3).reverse();
  if(recent.length){
    html+=`<div class="sec" style="color:#334;margin-top:4px">✓ RECENTLY COMPLETED</div>`;
    recent.forEach(m=>{
      const s=gL(m.id);
      const tAn=tN(tNum(m.tA)),tBn=tN(tNum(m.tB));
      const winner=s.sA>s.sB?tAn:tBn;
      html+=`<div style="background:#080f18;border:1px solid #1a2a3a;border-radius:10px;padding:10px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center">
        <div><div style="font-size:11px;color:${CC[m.court]};font-weight:700;letter-spacing:1px">MATCH ${m.id} · COURT ${m.court}</div><div style="font-size:13px;color:#ccd;margin-top:2px">${tAn} <span style="color:#334">vs</span> ${tBn}</div></div>
        <div style="text-align:right"><div style="font-family:'Bebas Neue',cursive;font-size:22px;color:#ccd">${s.sA}–${s.sB}</div><div style="font-size:10px;color:#00e676;font-weight:700">${winner} wins</div></div>
      </div>`;
    });
  }

  if(!liveLeague.length&&!liveKO.length&&doneCount===0){
    return `<div class="empty"><div style="font-size:38px">⏳</div><div style="margin-top:8px;font-size:14px">Tournament hasn't started</div><div style="font-size:11px;color:#223;margin-top:4px">Courts will light up when scorers go live</div></div>`;
  }
  return html;
}

function rStandings(standings,doneCount){
  if(!doneCount) return `<div class="empty"><div style="font-size:36px">📊</div><div style="margin-top:8px">Standings appear once matches complete</div></div>`;
  const rows=standings.map((r,i)=>{const isQ=i<8;return `<tr style="background:${isQ?"rgba(0,230,118,0.04)":i%2===0?"#0d1b2a":"#0a1628"};border-bottom:1px solid #1a2a3a"><td style="text-align:center;padding:6px 7px;color:${isQ?"#00e676":"#556"};font-weight:700">${i+1}</td><td style="padding:6px 7px;color:${isQ?"#fff":"#778"};font-weight:${isQ?600:400}">${r.team}</td><td style="text-align:center;color:#00e676">${r.wins}</td><td style="text-align:center;color:#ff6b6b">${r.losses}</td><td style="text-align:center;color:#aac">${r.pf}</td><td style="text-align:center;color:#aac">${r.pa}</td><td style="text-align:center;color:${r.diff>=0?"#00e676":"#ff6b6b"};font-weight:700">${r.diff>=0?"+":""}${r.diff}</td><td style="text-align:center">${isQ?`<span class="qb">Q${i+1}</span>`:"—"}</td></tr>`;}).join("");
  return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><span style="font-size:11px;color:#446">Top 8 qualify for QF</span><span style="font-size:10px;background:#003322;color:#00e676;border-radius:6px;padding:2px 9px;font-weight:700">${doneCount}/18</span></div>
  <div style="background:#0a1628;border-radius:12px;overflow:hidden;border:1px solid #0d2040;overflow-x:auto"><table class="stbl"><thead><tr style="background:#070f1e">${["#","Team","W","L","PF","PA","Diff",""].map(h=>`<th style="text-align:${h==="Team"?"left":"center"}">${h}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

function rKnockout(){
  const secs=[{title:"⚡ QUARTER FINALS",color:"#00c2ff",matches:QF},{title:"🔥 SEMI FINALS",color:"#ff6b35",matches:SF},{title:"👑 GRAND FINAL",color:"#ffd700",matches:[FN]}];
  const anyStarted=[...QF,...SF,FN].some(m=>{const s=gK(m.id);return s.confirmed||s.live||(s.sets&&s.sets.some(sv=>sv.a>0||sv.b>0));});
  if(!anyStarted) return `<div class="empty"><div style="font-size:36px">🏆</div><div style="margin-top:8px">Knockout stage hasn't started</div></div>`;
  return secs.map(sec=>`
    <div class="sec" style="color:${sec.color}">${sec.title}</div>
    ${sec.matches.map(m=>{
      const ko=gK(m.id);const{sets=[{a:0,b:0}],confirmed=false,live=false}=ko;
      const tA=gKT(m.sA),tB=gKT(m.sB);const cc=CC[m.court]||"#00c2ff";
      const sw=sets.reduce((a,s)=>{if(s.confirmed){if(s.a>s.b)a.a++;else if(s.b>s.a)a.b++;}return a;},{a:0,b:0});
      const winner=confirmed?(sw.a>sw.b?tA:tB):null;
      return `<div class="ko-card" style="background:${confirmed?"linear-gradient(135deg,#051a0e,#0a2018)":live?"linear-gradient(135deg,#0a1f0e,#0d2a18)":"linear-gradient(135deg,#0d1b2a,#112035)"};border:1.5px solid ${confirmed?"#00e676":live?cc:cc};">
        <div style="display:flex;justify-content:space-between;margin-bottom:8px"><span style="font-size:11px;color:${cc};font-weight:700;letter-spacing:2px">${m.id} · COURT ${m.court}</span><span style="font-size:10px;color:#445">${m.time}${live?" · 🟢 LIVE":""}</span></div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
          <div style="flex:1"><div style="font-size:13px;color:${winner===tA?"#00e676":"#ccd"};font-weight:700">${tA}</div></div>
          <div style="display:flex;align-items:center;gap:8px"><span style="font-family:'Bebas Neue',cursive;font-size:36px;color:${winner===tA?"#00e676":sw.a>sw.b?"#fff":"#334"}">${sw.a}</span><span style="color:#223;font-size:16px;font-weight:900">–</span><span style="font-family:'Bebas Neue',cursive;font-size:36px;color:${winner===tB?"#00e676":sw.b>sw.a?"#fff":"#334"}">${sw.b}</span></div>
          <div style="flex:1;text-align:right"><div style="font-size:13px;color:${winner===tB?"#00e676":"#ccd"};font-weight:700">${tB}</div></div>
        </div>
        ${sets.filter(s=>s.confirmed).map((s,i)=>`<div class="set-done">Set ${i+1}: ${s.a>s.b?tA:tB} wins ${s.a}–${s.b}</div>`).join("")}
        ${confirmed?`<div style="text-align:center;font-size:12px;color:#00e676;font-weight:700;margin-top:6px">🏆 ${winner} wins</div>`:""}
      </div>`;
    }).join("")}
    <div style="margin-bottom:14px"></div>`).join("");
}

function rTeams(){
  let h=`<div class="sec" style="color:#00c2ff">👥 ALL TEAMS</div>`;
  for(let i=1;i<=18;i++){
    const t=gT(i);
    h+=`<div class="team-view">
      <div style="font-family:'Bebas Neue',cursive;font-size:14px;letter-spacing:2px;color:#00c2ff;margin-bottom:7px">${t.name||`Team ${i}`}</div>
      ${t.p1?`<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:13px"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${t.p1avail!==false?"#00e676":"#ff4444"}"></span><span style="color:${t.p1avail!==false?"#ccd":"#556"}">${t.p1}</span><span style="font-size:10px;color:${t.p1avail!==false?"#00e676":"#ff6b6b"};margin-left:4px">${t.p1avail!==false?"✓ Available":"✗ Unavailable"}</span></div>`:`<div style="font-size:12px;color:#334;margin-bottom:4px">Player 1: TBD</div>`}
      ${t.p2?`<div style="display:flex;align-items:center;gap:6px;font-size:13px"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${t.p2avail!==false?"#00e676":"#ff4444"}"></span><span style="color:${t.p2avail!==false?"#ccd":"#556"}">${t.p2}</span><span style="font-size:10px;color:${t.p2avail!==false?"#00e676":"#ff6b6b"};margin-left:4px">${t.p2avail!==false?"✓ Available":"✗ Unavailable"}</span></div>`:`<div style="font-size:12px;color:#334">Player 2: TBD</div>`}
    </div>`;
  }
  return h;
}
</script>
