<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>RRR Scorer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#060d18;color:#ccd;font-family:'Rajdhani','Segoe UI',sans-serif;min-height:100vh;}
::-webkit-scrollbar{width:5px;background:#0a1628;}
::-webkit-scrollbar-thumb{background:#0d3060;border-radius:3px;}
button{transition:transform 0.08s;cursor:pointer;font-family:'Rajdhani',sans-serif;}
button:not(:disabled):active{transform:scale(0.93);}
input{font-family:'Rajdhani',sans-serif;}
.hdr{background:linear-gradient(135deg,#020a14,#0a1f35);border-bottom:2px solid #0d3060;padding:14px 14px 0;}
.title{font-family:'Bebas Neue',cursive;font-size:22px;letter-spacing:4px;color:#00c2ff;line-height:1;}
.sub{font-size:10px;color:#446;letter-spacing:3px;margin-top:2px;}
.tabs{display:flex;margin-top:12px;}
.tab{background:transparent;border:none;border-bottom:3px solid transparent;color:#446;padding:9px 14px;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;}
.tab.active{background:linear-gradient(135deg,#0d3060,#0a2040);border-bottom-color:#00c2ff;color:#00c2ff;}
.ref-bar{background:#0a1f35;border-bottom:1px solid #0d3060;padding:7px 14px;display:flex;align-items:center;gap:8px;font-size:12px;}
.content{max-width:700px;margin:0 auto;padding:14px 12px;}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
.login-card{background:linear-gradient(135deg,#0d1b2a,#112035);border:1.5px solid #00c2ff;border-radius:16px;padding:28px 22px;max-width:340px;width:100%;text-align:center;}
.l-input{width:100%;background:#070f1e;border:1.5px solid #1a3060;color:#fff;font-size:15px;padding:11px 14px;border-radius:8px;outline:none;margin-bottom:10px;text-align:center;}
.l-btn{width:100%;background:linear-gradient(135deg,#0077b6,#0096c7);border:none;color:#fff;font-size:13px;font-weight:700;letter-spacing:3px;padding:11px;border-radius:8px;}
.l-err{color:#ff6b6b;font-size:11px;margin-top:6px;}
.mc{border-radius:14px;padding:13px 14px;margin-bottom:10px;}
.mh{display:flex;justify-content:space-between;margin-bottom:8px;}
.ml{font-size:11px;font-weight:700;letter-spacing:2px;}
.sr{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.tb{flex:1;text-align:center;}
.tn{font-size:12px;margin-bottom:1px;}
.pn{font-size:10px;color:#446;margin-bottom:3px;min-height:13px;line-height:1.3;}
.sn{font-family:'Bebas Neue',cursive;font-size:52px;line-height:1;}
.deuce-banner{background:linear-gradient(135deg,#1a0a00,#2a1400);border:2px solid #ff9800;border-radius:10px;padding:10px;text-align:center;margin-bottom:10px;animation:deuceFlash 0.8s infinite;}
@keyframes deuceFlash{0%,100%{border-color:#ff9800;box-shadow:0 0 10px rgba(255,152,0,0.3);}50%{border-color:#ffcc02;box-shadow:0 0 20px rgba(255,204,0,0.5);}}
.deuce-text{font-family:'Bebas Neue',cursive;font-size:26px;letter-spacing:6px;color:#ff9800;}
.deuce-sub{font-size:11px;color:#a06000;margin-top:2px;}
.pb{display:flex;height:3px;border-radius:2px;overflow:hidden;margin-bottom:10px;background:#1a2a3a;}
.br{display:flex;gap:7px;}
.pb2{flex:1;border-radius:8px;padding:10px 4px;font-size:11px;font-weight:700;letter-spacing:0.5px;border-width:1.5px;border-style:solid;}
.ib{border-radius:8px;padding:8px 11px;font-size:14px;font-weight:700;border-width:1.5px;border-style:solid;}
.pa{display:flex;align-items:center;gap:7px;margin-bottom:9px;padding:7px 11px;background:#070f1e;border-radius:8px;border:1px solid #1a3060;}
.pi{width:56px;background:#0a1628;border:1.5px solid #1a3060;color:#00c2ff;font-size:17px;font-family:'Bebas Neue',cursive;text-align:center;padding:4px;border-radius:6px;outline:none;}
.go-live-btn{width:100%;background:linear-gradient(135deg,#004a00,#006a00);border:2px solid #00e676;color:#00e676;border-radius:10px;padding:12px;font-size:14px;font-weight:700;letter-spacing:3px;margin-bottom:8px;}
.submit-btn{width:100%;background:linear-gradient(135deg,#1a0000,#2a0000);border:2px solid #ff4444;color:#ff6b6b;border-radius:10px;padding:12px;font-size:14px;font-weight:700;letter-spacing:3px;margin-top:8px;}
.live-badge{display:inline-flex;align-items:center;gap:4px;background:#001a0d;border:1px solid #00e67640;color:#00e676;border-radius:5px;padding:2px 8px;font-size:10px;font-weight:700;}
.locked-msg{background:#051a0e;border-radius:8px;padding:10px;font-size:12px;color:#00e676;font-weight:700;letter-spacing:1px;text-align:center;}
.set-blk{border-radius:10px;padding:10px 11px;margin-bottom:7px;}
.set-ctrl{display:flex;align-items:center;gap:7px;}
.st{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;}
.ss{font-family:'Bebas Neue',cursive;font-size:30px;min-width:36px;text-align:center;}
.ab{background:#0d2540;border:1px solid #2a4060;color:#aac;border-radius:6px;width:30px;height:30px;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.ab:disabled{background:#0a1628;border-color:#1a2a3a;color:#2a3a4a;}
.cm-btn{width:100%;border-radius:8px;padding:10px;font-size:13px;font-weight:700;letter-spacing:2px;margin-top:4px;background:linear-gradient(135deg,#003322,#004a30);border:1.5px solid #00e676;color:#00e676;}
.stbl{width:100%;border-collapse:collapse;font-size:12px;}
.stbl th{padding:7px 8px;color:#00c2ff;font-weight:700;letter-spacing:1px;border-bottom:2px solid #0d2040;}
.stbl td{padding:6px 8px;border-bottom:1px solid #1a2a3a;}
/* Scorer lock banner */
.lock-info{background:#070f1e;border:1.5px solid #1a3060;border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:12px;color:#556;text-align:center;}
.court-select{background:#070f1e;border:1.5px solid #00c2ff;color:#00c2ff;font-size:14px;font-weight:700;font-family:'Rajdhani',sans-serif;padding:9px 14px;border-radius:8px;width:100%;margin-bottom:12px;outline:none;}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const FC={apiKey:"AIzaSyBYKxzFoQAKKddALIDqtHtsKqlQkes3ax4",authDomain:"rrr-tournamet.firebaseapp.com",databaseURL:"https://rrr-tournamet-default-rtdb.firebaseio.com",projectId:"rrr-tournamet",storageBucket:"rrr-tournamet.firebasestorage.app",messagingSenderId:"368535382395",appId:"1:368535382395:web:c72ef4b64648b60ec175de"};
const fb=initializeApp(FC), db=getDatabase(fb);
const PASS="RRR@score2024";

// Courts 3→1, 4→2, 5→3 (physical courts renamed to displayed courts 1,2,3)
const LM=[
  {id:1,tA:"Team 1",tB:"Team 11",court:1,time:"10:00 AM"},{id:2,tA:"Team 13",tB:"Team 8",court:2,time:"10:00 AM"},
  {id:3,tA:"Team 5",tB:"Team 3",court:3,time:"10:00 AM"},{id:4,tA:"Team 15",tB:"Team 14",court:1,time:"10:15 AM"},
  {id:5,tA:"Team 16",tB:"Team 10",court:2,time:"10:15 AM"},{id:6,tA:"Team 2",tB:"Team 4",court:3,time:"10:15 AM"},
  {id:7,tA:"Team 1",tB:"Team 18",court:1,time:"10:30 AM"},{id:8,tA:"Team 13",tB:"Team 6",court:2,time:"10:30 AM"},
  {id:9,tA:"Team 5",tB:"Team 7",court:3,time:"10:30 AM"},{id:10,tA:"Team 15",tB:"Team 12",court:1,time:"10:45 AM"},
  {id:11,tA:"Team 16",tB:"Team 9",court:2,time:"10:45 AM"},{id:12,tA:"Team 2",tB:"Team 17",court:3,time:"10:45 AM"},
  {id:13,tA:"Team 11",tB:"Team 18",court:1,time:"11:00 AM"},{id:14,tA:"Team 8",tB:"Team 6",court:2,time:"11:00 AM"},
  {id:15,tA:"Team 3",tB:"Team 7",court:3,time:"11:00 AM"},{id:16,tA:"Team 14",tB:"Team 12",court:1,time:"11:15 AM"},
  {id:17,tA:"Team 10",tB:"Team 9",court:2,time:"11:15 AM"},{id:18,tA:"Team 4",tB:"Team 17",court:3,time:"11:15 AM"},
];
const QF=[{id:"QF1",sA:"Q2",sB:"Q5",court:1,time:"11:30 AM"},{id:"QF2",sA:"Q4",sB:"Q3",court:2,time:"11:30 AM"},{id:"QF3",sA:"Q7",sB:"Q6",court:1,time:"11:50 AM"},{id:"QF4",sA:"Q1",sB:"Q8",court:2,time:"11:50 AM"}];
const SF=[{id:"SF1",sA:"W.QF1",sB:"W.QF2",court:1,time:"12:15 PM"},{id:"SF2",sA:"W.QF3",sB:"W.QF4",court:2,time:"12:15 PM"}];
const FN={id:"F1",sA:"W.SF1",sB:"W.SF2",court:1,time:"12:50 PM"};
const CC={1:"#00c2ff",2:"#ff6b35",3:"#00e676"};

// ── Deuce logic ──────────────────────────────────────────────
// 21-pt: deuce at 20-20, cap at 29-29 (30th pt wins)
// 15-pt: deuce at 14-14, cap at 20-20 (21st pt wins)
function getDeuceAt(max){return max-1;}          // 21→20, 15→14
function getCap(max){return max===21?30:21;}     // 21→30, 15→21

function isDeuceActive(sA,sB,max){
  const d=getDeuceAt(max);
  return sA>=d&&sB>=d;
}

function getWinner(sA,sB,max,consec){
  const cap=getCap(max);
  if(isDeuceActive(sA,sB,max)){
    // Golden point: if either reaches cap, that team wins
    if(sA>=cap) return "A";
    if(sB>=cap) return "B";
    // Normal deuce: win by 2 consecutive
    if(consec?.team==="A"&&consec?.count>=2) return "A";
    if(consec?.team==="B"&&consec?.count>=2) return "B";
    return null;
  }
  if(sA>=max&&sA>sB) return "A";
  if(sB>=max&&sB>sA) return "B";
  return null;
}

function updateConsec(consec,side){
  if(!consec||consec.team!==side) return {team:side,count:1};
  return {team:side,count:consec.count+1};
}

// ── State ────────────────────────────────────────────────────
let step="login",refName="",activeTab="league",assignedCourt=0;
let ld={},kd={},td={};
onValue(ref(db,"league"),s=>{ld=s.val()||{};render();});
onValue(ref(db,"knockout"),s=>{kd=s.val()||{};render();});
onValue(ref(db,"teams"),s=>{td=s.val()||{};render();});

const gL=id=>ld[`m${id}`]||{sA:0,sB:0,history:[],confirmed:false,live:false,maxPts:21,consec:null};
const gK=id=>kd[id]||{sets:[{a:0,b:0}],confirmed:false,live:false,maxPts:15};
const gT=id=>td[`t${id}`]||{name:`Team ${id}`,p1:"",p2:"",p1avail:true,p2avail:true};
const tN=id=>gT(id).name||`Team ${id}`;
const tNum=s=>parseInt(s.split(" ")[1]);
const sL=(id,v)=>set(ref(db,`league/m${id}`),v);
const sK=(id,v)=>set(ref(db,`knockout/${id}`),v);

function calcStandings(){
  const map={};
  for(let i=1;i<=18;i++) map[`Team ${i}`]={team:tN(i),id:i,wins:0,losses:0,pf:0,pa:0,diff:0,pts:0};
  LM.forEach(m=>{
    const s=gL(m.id);if(!s.confirmed)return;
    map[m.tA].pf+=s.sA;map[m.tA].pa+=s.sB;map[m.tB].pf+=s.sB;map[m.tB].pa+=s.sA;
    if(s.sA>s.sB){map[m.tA].wins++;map[m.tA].pts+=2;map[m.tB].losses++;}
    else{map[m.tB].wins++;map[m.tB].pts+=2;map[m.tA].losses++;}
  });
  Object.values(map).forEach(r=>r.diff=r.pf-r.pa);
  return Object.values(map).sort((a,b)=>b.pts-a.pts||b.diff-a.diff);
}

function gKT(slot){
  const q=calcStandings().slice(0,8);
  if(slot.startsWith("Q")){const r=parseInt(slot.slice(1))-1;return q[r]?.team||slot;}
  if(slot.startsWith("W.QF")){const id=slot.slice(2);const s=gK(id);if(!s.confirmed)return slot;const m=QF.find(x=>x.id===id);const w=s.sets.reduce((a,sv)=>{if(sv.confirmed){if(sv.a>sv.b)a.a++;else a.b++;}return a;},{a:0,b:0});return w.a>w.b?gKT(m.sA):gKT(m.sB);}
  if(slot.startsWith("W.SF")){const id=slot.slice(2);const s=gK(id);if(!s.confirmed)return slot;const m=SF.find(x=>x.id===id);const w=s.sets.reduce((a,sv)=>{if(sv.confirmed){if(sv.a>sv.b)a.a++;else a.b++;}return a;},{a:0,b:0});return w.a>w.b?gKT(m.sA):gKT(m.sB);}
  return slot;
}

// ── Render ───────────────────────────────────────────────────
function render(){
  document.getElementById("app").innerHTML=step==="login"?rLogin():step==="name"?rName():step==="court"?rCourtSelect():rApp();
  attach();
}

function rLogin(){
  return `<div class="login-wrap"><div class="login-card">
    <div style="font-size:34px;margin-bottom:8px">🏸</div>
    <div class="title">RRR SCORER</div>
    <div class="sub" style="margin-bottom:22px;color:#446;letter-spacing:3px">SCOREKEEPER ACCESS</div>
    <input class="l-input" style="letter-spacing:4px" type="password" id="pw" placeholder="••••••••"/>
    <button class="l-btn" id="lb">ENTER</button>
    <div class="l-err" id="le"></div>
  </div></div>`;
}

function rName(){
  return `<div class="login-wrap"><div class="login-card">
    <div style="font-size:32px;margin-bottom:8px">👤</div>
    <div class="title">YOUR NAME</div>
    <div class="sub" style="margin-bottom:22px">REFEREE / SCORER</div>
    <input class="l-input" type="text" id="ni" placeholder="Enter your name" value="${refName}"/>
    <button class="l-btn" id="nb">NEXT</button>
    <div class="l-err" id="ne"></div>
  </div></div>`;
}

function rCourtSelect(){
  return `<div class="login-wrap"><div class="login-card">
    <div style="font-size:32px;margin-bottom:8px">🏟️</div>
    <div class="title">SELECT YOUR COURT</div>
    <div class="sub" style="margin-bottom:22px">Hi ${refName} — which court are you scoring?</div>
    <select class="court-select" id="courtSel" style="text-align:center;margin-bottom:14px">
      <option value="0">-- Select Court --</option>
      <option value="1">Court 1</option>
      <option value="2">Court 2</option>
      <option value="3">Court 3</option>
    </select>
    <button class="l-btn" id="cb">START SCORING</button>
    <div class="l-err" id="ce"></div>
    <div style="font-size:10px;color:#334;margin-top:10px;line-height:1.5">You will only be able to score matches on your assigned court. Other courts are locked to prevent accidental entries.</div>
  </div></div>`;
}

function rApp(){
  const cc=LM.filter(m=>gL(m.id).confirmed).length;
  const courtLabel=assignedCourt?`COURT ${assignedCourt}`:"ALL COURTS";
  return `<div class="hdr">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">
      <span style="font-size:26px">🏸</span>
      <div><div class="title">RRR SCORER</div><div class="sub">${cc}/18 LEAGUE DONE</div></div>
      <button id="lo" style="margin-left:auto;background:transparent;border:1px solid #334;color:#556;border-radius:6px;padding:5px 10px;font-size:11px;">Exit</button>
    </div>
    <div class="tabs">
      <button class="tab ${activeTab==='league'?'active':''}" data-tab="league">League</button>
      <button class="tab ${activeTab==='standings'?'active':''}" data-tab="standings">Standings</button>
      <button class="tab ${activeTab==='knockout'?'active':''}" data-tab="knockout">Knockout</button>
    </div>
  </div>
  <div class="ref-bar">
    <span style="font-size:10px;color:#446;letter-spacing:1px">SCORER:</span>
    <span style="color:#00c2ff;font-weight:700;font-size:12px">${refName}</span>
    <span style="margin-left:auto;font-size:10px;background:#001a3a;border:1px solid #00c2ff40;color:#00c2ff;border-radius:4px;padding:2px 8px;font-weight:700">🏟️ ${courtLabel}</span>
  </div>
  <div class="content">${activeTab==='league'?rLeague():activeTab==='standings'?rStandings():rKnockout()}</div>`;
}

function isMyMatch(courtNum){
  if(!assignedCourt) return true; // no court assigned = can score all (fallback)
  return courtNum===assignedCourt;
}

function rLeague(){
  return `<div style="font-size:11px;color:#446;letter-spacing:1px;margin-bottom:12px">Set max pts → Go Live → Score → Submit to lock</div>`+LM.map(m=>rLC(m)).join('');
}

function rLC(m){
  const s=gL(m.id);
  const {sA=0,sB=0,history=[],confirmed=false,live=false,maxPts=21,consec=null}=s;
  const cc=CC[m.court];
  const tAn=tN(tNum(m.tA)), tBn=tN(tNum(m.tB));
  const tAd=gT(tNum(m.tA)), tBd=gT(tNum(m.tB));
  const deuce=isDeuceActive(sA,sB,maxPts);
  const cap=getCap(maxPts);
  const winner=getWinner(sA,sB,maxPts,consec);
  const canSubmit=!!winner&&live;
  const myMatch=isMyMatch(m.court);

  if(confirmed) return `<div class="mc" style="background:linear-gradient(135deg,#051a0e,#0a2a18);border:1.5px solid #00e676;">
    <div class="mh"><span class="ml" style="color:${cc}">MATCH ${m.id} · COURT ${m.court}</span><span style="font-size:10px;color:#445">${m.time}</span></div>
    <div class="locked-msg">🔒 ${sA>sB?tAn:tBn} wins · ${sA}–${sB} · LOCKED</div>
  </div>`;

  // Locked for another court's scorer
  if(!myMatch) return `<div class="mc" style="background:#070d18;border:1.5px solid #1a2a3a;opacity:0.55;">
    <div class="mh"><span class="ml" style="color:#334">MATCH ${m.id} · COURT ${m.court}</span><span style="font-size:10px;color:#223">${m.time}</span></div>
    <div style="text-align:center;font-size:11px;color:#334;padding:8px 0">🔒 Court ${m.court} · Managed by another scorer</div>
  </div>`;

  return `<div class="mc" style="background:${live?'linear-gradient(135deg,#0a1f10,#0d2a18)':'linear-gradient(135deg,#0d1b2a,#112035)'};border:1.5px solid ${live?'#00e676':cc};">
    <div class="mh"><span class="ml" style="color:${cc}">MATCH ${m.id} · COURT ${m.court}</span><div style="display:flex;align-items:center;gap:6px"><span style="font-size:10px;color:#445">${m.time}</span>${live?`<span class="live-badge"><span style="width:6px;height:6px;background:#00e676;border-radius:50%;display:inline-block;animation:pulse 1s infinite"></span>LIVE</span>`:''}</div></div>
    ${!live?`<div class="pa"><span style="font-size:11px;color:#556;letter-spacing:1px">MAX PTS:</span><input class="pi" type="number" min="5" max="50" value="${maxPts}" data-action="lpts" data-id="${m.id}"/><button data-action="slpts" data-id="${m.id}" style="background:#0d2040;border:1px solid #1a3060;color:#00c2ff;border-radius:6px;padding:4px 9px;font-size:11px;font-weight:700;">SET</button><span style="font-size:10px;color:#334;margin-left:auto">First to ${maxPts} · Deuce @${getDeuceAt(maxPts)}-${getDeuceAt(maxPts)} · Cap ${cap}</span></div>`:''}
    ${deuce?`<div class="deuce-banner"><div class="deuce-text">🏸 DEUCE!</div><div class="deuce-sub">${consec?.team?`${consec.team==="A"?tAn:tBn} leads · ${consec.count} consec.`:'Win by 2 consecutive · Golden pt at '+cap}</div></div>`:''}
    <div class="sr">
      <div class="tb">
        <div class="tn" style="color:${sA>sB?'#fff':'#778'}">${tAn}</div>
        <div class="pn">${tAd.p1?`<span style="color:${tAd.p1avail!==false?'#00e676':'#ff6b6b'}">●</span> ${tAd.p1}`:''}${tAd.p1&&tAd.p2?'<br>':''}${tAd.p2?`<span style="color:${tAd.p2avail!==false?'#00e676':'#ff6b6b'}">●</span> ${tAd.p2}`:''}</div>
        <div class="sn" style="color:${sA>sB?deuce?'#ff9800':'#fff':'#445'}">${sA}</div>
      </div>
      <div style="color:#334;font-weight:900;font-size:16px;padding-bottom:28px">–</div>
      <div class="tb">
        <div class="tn" style="color:${sB>sA?'#fff':'#778'}">${tBn}</div>
        <div class="pn">${tBd.p1?`<span style="color:${tBd.p1avail!==false?'#00e676':'#ff6b6b'}">●</span> ${tBd.p1}`:''}${tBd.p1&&tBd.p2?'<br>':''}${tBd.p2?`<span style="color:${tBd.p2avail!==false?'#00e676':'#ff6b6b'}">●</span> ${tBd.p2}`:''}</div>
        <div class="sn" style="color:${sB>sA?deuce?'#ff9800':'#fff':'#445'}">${sB}</div>
      </div>
    </div>
    ${!deuce?`<div class="pb"><div style="width:${Math.min(100,(sA/maxPts)*100)}%;background:#00c2ff;border-radius:2px;transition:width 0.15s"></div><div style="flex:1"></div><div style="width:${Math.min(100,(sB/maxPts)*100)}%;background:#ff6b35;border-radius:2px;transition:width 0.15s"></div></div>`:''}
    ${!live
      ?`<button class="go-live-btn" data-action="golive" data-id="${m.id}">🟢 GO LIVE</button>`
      :`<div class="br" style="margin-bottom:8px">
          <button class="pb2" data-action="score" data-id="${m.id}" data-side="A" ${winner?'disabled':''} style="background:${winner?'#1a2a3a':'#00c2ff18'};border-color:${winner?'#2a3a4a':'#00c2ff'};color:${winner?'#334':'#00c2ff'};font-size:13px;padding:14px 4px">+1 ${tAn}</button>
          <button class="pb2" data-action="score" data-id="${m.id}" data-side="B" ${winner?'disabled':''} style="background:${winner?'#1a2a3a':'#ff6b3518'};border-color:${winner?'#2a3a4a':'#ff6b35'};color:${winner?'#334':'#ff6b35'};font-size:13px;padding:14px 4px">+1 ${tBn}</button>
          <button class="ib" data-action="undo" data-id="${m.id}" ${!history.length?'disabled':''} style="background:${history.length?'#22283a':'#1a2a3a'};border-color:${history.length?'#778':'#2a3a4a'};color:${history.length?'#aac':'#334'}">↩</button>
        </div>
        ${canSubmit?`<button class="submit-btn" data-action="submit-league" data-id="${m.id}">🔒 SUBMIT & LOCK MATCH</button>`:''}`
    }
  </div>`;
}

function rStandings(){
  const st=calcStandings();
  const cc=LM.filter(m=>gL(m.id).confirmed).length;
  if(!cc) return `<div style="text-align:center;padding:50px 20px;color:#334"><div style="font-size:36px">📊</div><div style="margin-top:8px">Score matches to see standings</div></div>`;
  const rows=st.map((r,i)=>{const isQ=i<8;return `<tr style="background:${isQ?'rgba(0,230,118,0.04)':i%2===0?'#0d1b2a':'#0a1628'};border-bottom:1px solid #1a2a3a"><td style="text-align:center;padding:6px 7px;color:${isQ?'#00e676':'#556'};font-weight:700">${i+1}</td><td style="padding:6px 7px;color:${isQ?'#fff':'#778'};font-weight:${isQ?600:400}">${r.team}</td><td style="text-align:center;color:#00e676">${r.wins}</td><td style="text-align:center;color:#ff6b6b">${r.losses}</td><td style="text-align:center;color:#aac">${r.pf}</td><td style="text-align:center;color:#aac">${r.pa}</td><td style="text-align:center;color:${r.diff>=0?'#00e676':'#ff6b6b'};font-weight:700">${r.diff>=0?'+':''}${r.diff}</td><td style="text-align:center">${isQ?`<span style="background:#003322;color:#00e676;border-radius:4px;padding:2px 5px;font-size:10px;font-weight:700">Q${i+1}</span>`:'—'}</td></tr>`;}).join('');
  return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><span style="font-size:11px;color:#446">Top 8 qualify</span><span style="font-size:10px;background:#003322;color:#00e676;border-radius:6px;padding:2px 9px;font-weight:700">${cc}/18</span></div><div style="background:#0a1628;border-radius:12px;overflow:hidden;border:1px solid #0d2040;overflow-x:auto"><table class="stbl"><thead><tr style="background:#070f1e">${["#","Team","W","L","PF","PA","Diff",""].map(h=>`<th style="text-align:${h==='Team'?'left':'center'}">${h}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

function rKnockout(){
  const secs=[
    {title:"⚡ QUARTER FINALS",color:"#00c2ff",matches:QF,dp:15},
    {title:"🔥 SEMI FINALS",color:"#ff6b35",matches:SF,dp:15},
    {title:"👑 GRAND FINAL",color:"#ffd700",matches:[FN],dp:21}
  ];
  return secs.map(sec=>`<div style="font-family:'Bebas Neue',cursive;font-size:16px;letter-spacing:4px;color:${sec.color};margin-bottom:10px">${sec.title}</div>${sec.matches.map(m=>rKC(m,sec.dp)).join('')}<div style="margin-bottom:14px"></div>`).join('');
}

function rKC(m,dp){
  const ko=gK(m.id);
  const {sets=[{a:0,b:0}],confirmed=false,live=false,maxPts=dp}=ko;
  const tA=gKT(m.sA),tB=gKT(m.sB);
  const cc=CC[m.court]||"#00c2ff";
  const sw=sets.reduce((a,s)=>{if(s.confirmed){if(s.a>s.b)a.a++;else if(s.b>s.a)a.b++;}return a;},{a:0,b:0});
  const winner=confirmed?(sw.a>sw.b?tA:tB):null;
  const canConfirm=!confirmed&&(sw.a===2||sw.b===2);
  const myMatch=isMyMatch(m.court);

  if(confirmed) return `<div class="mc" style="background:linear-gradient(135deg,#051a0e,#0a2018);border:1.5px solid #00e676;">
    <div class="mh"><span class="ml" style="color:${cc}">${m.id} · COURT ${m.court}</span><span style="font-size:10px;color:#445">${m.time}</span></div>
    <div class="locked-msg">🔒 ${winner} wins (${sw.a}–${sw.b} sets) · LOCKED</div>
  </div>`;

  if(!myMatch) return `<div class="mc" style="background:#070d18;border:1.5px solid #1a2a3a;opacity:0.55;">
    <div class="mh"><span class="ml" style="color:#334">${m.id} · COURT ${m.court}</span><span style="font-size:10px;color:#223">${m.time}</span></div>
    <div style="text-align:center;font-size:11px;color:#334;padding:8px 0">🔒 Court ${m.court} · Managed by another scorer</div>
  </div>`;

  const setsHtml=sets.map((s,idx)=>{
    if(s.confirmed){
      const deuce=isDeuceActive(s.a,s.b,maxPts);
      return `<div style="background:#071a0e;border:1px solid #1a4a2a;border-radius:8px;padding:7px 11px;margin-bottom:6px;font-size:11px;color:#00e676;font-weight:700">SET ${idx+1}: ${s.a>s.b?tA:tB} wins ${s.a}–${s.b}${deuce?' (D)':''}</div>`;
    }
    const deuce=isDeuceActive(s.a,s.b,maxPts);
    const cap=getCap(maxPts);
    const sw2=getWinner(s.a,s.b,maxPts,s.consec);
    return `<div class="set-blk" style="background:#0a1825;border:1px solid #1a3050">
      <div style="font-size:11px;color:#557;letter-spacing:2px;font-weight:700;margin-bottom:${deuce?4:8}px">SET ${idx+1} · up to ${maxPts} pts${deuce?' · GOLDEN PT @ '+cap:''}</div>
      ${deuce?`<div style="background:#1a0a00;border:1px solid #ff980050;border-radius:6px;padding:5px 8px;margin-bottom:8px;text-align:center"><span style="font-family:'Bebas Neue',cursive;font-size:18px;color:#ff9800;letter-spacing:4px">DEUCE!</span>${s.consec?.team?`<span style="font-size:10px;color:#a06000;margin-left:8px">${s.consec.team==="a"?tA:tB} leads · ${s.consec.count} pts</span>`:''}</div>`:''}
      <div class="set-ctrl">
        <div class="st"><button class="ab" data-action="aks" data-mid="${m.id}" data-si="${idx}" data-side="a" data-d="-1" ${s.a<=0||sw2?'disabled':''}>–</button><span class="ss" style="color:${s.a>s.b?deuce?'#ff9800':'#fff':'#445'}">${s.a}</span><button class="ab" data-action="aks" data-mid="${m.id}" data-si="${idx}" data-side="a" data-d="1" ${sw2?'disabled':''}>+</button></div>
        <div style="color:#334;font-weight:900;font-size:13px">:</div>
        <div class="st"><button class="ab" data-action="aks" data-mid="${m.id}" data-si="${idx}" data-side="b" data-d="-1" ${s.b<=0||sw2?'disabled':''}>–</button><span class="ss" style="color:${s.b>s.a?deuce?'#ff9800':'#fff':'#445'}">${s.b}</span><button class="ab" data-action="aks" data-mid="${m.id}" data-si="${idx}" data-side="b" data-d="1" ${sw2?'disabled':''}>+</button></div>
        <button data-action="cset" data-mid="${m.id}" data-si="${idx}" ${!sw2?'disabled':''} style="background:${sw2?'#003322':'#1a1a2a'};border:1.5px solid ${sw2?'#00e676':'#2a2a4a'};color:${sw2?'#00e676':'#334'};border-radius:8px;padding:6px 11px;font-size:12px;font-weight:700;">Done</button>
      </div>
    </div>`;
  }).join('');

  return `<div class="mc" style="background:linear-gradient(135deg,#0d1b2a,#112035);border:1.5px solid ${cc};">
    <div class="mh"><span class="ml" style="color:${cc}">${m.id} · COURT ${m.court}</span><div style="display:flex;align-items:center;gap:6px"><span style="font-size:10px;color:#445">${m.time}</span>${live?`<span class="live-badge"><span style="width:6px;height:6px;background:#00e676;border-radius:50%;display:inline-block"></span>LIVE</span>`:''}</div></div>
    ${!live?`<div class="pa"><span style="font-size:11px;color:#556">PTS/SET:</span><input class="pi" type="number" min="5" max="50" value="${maxPts}" data-action="kpts" data-mid="${m.id}"/><button data-action="skpts" data-mid="${m.id}" style="background:#0d2040;border:1px solid #1a3060;color:#00c2ff;border-radius:6px;padding:4px 9px;font-size:11px;font-weight:700;">SET</button></div>`:''}
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <div style="flex:1"><div style="font-size:13px;color:#ccd;font-weight:700">${tA}</div><div style="font-size:10px;color:#445;margin-top:1px">sets won</div></div>
      <div style="display:flex;align-items:center;gap:8px"><span style="font-family:'Bebas Neue',cursive;font-size:36px;color:${sw.a>sw.b?'#fff':'#445'}">${sw.a}</span><span style="color:#334;font-size:16px;font-weight:900">–</span><span style="font-family:'Bebas Neue',cursive;font-size:36px;color:${sw.b>sw.a?'#fff':'#445'}">${sw.b}</span></div>
      <div style="flex:1;text-align:right"><div style="font-size:13px;color:#ccd;font-weight:700">${tB}</div><div style="font-size:10px;color:#445;margin-top:1px">sets won</div></div>
    </div>
    ${setsHtml}
    ${!live?`<button class="go-live-btn" data-action="ko-golive" data-mid="${m.id}">🟢 GO LIVE</button>`:''}
    ${canConfirm&&live?`<button class="submit-btn" data-action="submit-ko" data-mid="${m.id}">🔒 SUBMIT & LOCK MATCH</button>`:canConfirm?`<button class="cm-btn" data-action="submit-ko" data-mid="${m.id}">✓ CONFIRM MATCH RESULT</button>`:''}
  </div>`;
}

// ── Event Handlers ────────────────────────────────────────────
function attach(){
  // Login
  const lb=document.getElementById("lb"),pw=document.getElementById("pw");
  if(lb){
    lb.onclick=()=>{if(pw.value===PASS){step="name";render();}else document.getElementById("le").textContent="Wrong password";};
    pw&&(pw.onkeydown=e=>{if(e.key==="Enter")lb.click();});
  }
  // Name
  const nb=document.getElementById("nb"),ni=document.getElementById("ni");
  if(nb){
    nb.onclick=()=>{const v=ni.value.trim();if(!v){document.getElementById("ne").textContent="Enter your name";return;}refName=v;step="court";render();};
    ni&&(ni.onkeydown=e=>{if(e.key==="Enter")nb.click();});
  }
  // Court select
  const cb=document.getElementById("cb");
  if(cb){
    cb.onclick=()=>{
      const sel=document.getElementById("courtSel");
      const v=parseInt(sel.value);
      if(!v){document.getElementById("ce").textContent="Please select a court";return;}
      assignedCourt=v;step="app";render();
    };
  }
  // Logout
  const lo=document.getElementById("lo");if(lo)lo.onclick=()=>{step="login";refName="";assignedCourt=0;activeTab="league";render();};
  // Tabs
  document.querySelectorAll("[data-tab]").forEach(el=>el.onclick=()=>{activeTab=el.dataset.tab;render();});
  // Actions
  document.querySelectorAll("[data-action]").forEach(el=>{
    const a=el.dataset.action;
    if(a==="lpts")return;
    if(a==="slpts"){el.onclick=()=>{const id=+el.dataset.id;const inp=document.querySelector(`[data-action="lpts"][data-id="${id}"]`);const p=Math.max(5,Math.min(50,+inp.value||21));const s=gL(id);sL(id,{...s,maxPts:p});el.textContent="✓";setTimeout(()=>el.textContent="SET",1200);};}
    else if(a==="golive"){el.onclick=()=>{const id=+el.dataset.id;const s=gL(id);sL(id,{...s,live:true,scorerName:refName});};}
    else if(a==="score"){
      el.onclick=()=>{
        const id=+el.dataset.id,side=el.dataset.side;
        const s=gL(id);
        if(s.confirmed||!s.live)return;
        const h=[...(s.history||[]),{sA:s.sA,sB:s.sB,consec:s.consec}];
        const ns={...s,history:h};
        if(side==="A"){ns.sA=(s.sA||0)+1;ns.consec=updateConsec(s.consec,"A");}
        else{ns.sB=(s.sB||0)+1;ns.consec=updateConsec(s.consec,"B");}
        sL(id,ns);
      };
    }
    else if(a==="undo"){el.onclick=()=>{const id=+el.dataset.id;const s=gL(id);if(!s.history?.length)return;const prev=s.history[s.history.length-1];sL(id,{...s,...prev,history:s.history.slice(0,-1)});};}
    else if(a==="submit-league"){el.onclick=()=>{
      const id=+el.dataset.id;const s=gL(id);
      if(!confirm(`Submit match? Score will be LOCKED. Only admin can reset.`))return;
      sL(id,{...s,confirmed:true,live:false,scoredBy:refName});
    };}
    else if(a==="kpts")return;
    else if(a==="skpts"){el.onclick=()=>{const mid=el.dataset.mid;const inp=document.querySelector(`[data-action="kpts"][data-mid="${mid}"]`);const p=Math.max(5,Math.min(50,+inp.value||15));const ko=gK(mid);sK(mid,{...ko,maxPts:p});el.textContent="✓";setTimeout(()=>el.textContent="SET",1200);};}
    else if(a==="ko-golive"){el.onclick=()=>{const mid=el.dataset.mid;const ko=gK(mid);sK(mid,{...ko,live:true,scorerName:refName});};}
    else if(a==="aks"){el.onclick=()=>{
      const mid=el.dataset.mid,si=+el.dataset.si,side=el.dataset.side,d=+el.dataset.d;
      const ko=gK(mid);const maxP=ko.maxPts||15;
      const sets=ko.sets.map((s,i)=>{
        if(i!==si)return s;
        const nv=Math.max(0,s[side]+d);
        const ns={...s,[side]:nv};
        if(d>0){ns.consec=updateConsec(s.consec,side);}
        else{ns.consec=null;}
        return ns;
      });
      sK(mid,{...ko,sets});
    };}
    else if(a==="cset"){el.onclick=()=>{
      const mid=el.dataset.mid,si=+el.dataset.si;
      const ko=gK(mid);const s=ko.sets[si];
      const w=getWinner(s.a,s.b,ko.maxPts||15,s.consec);
      if(!w)return;
      const sets=ko.sets.map((sv,i)=>i===si?{...sv,confirmed:true}:sv);
      const sw=sets.reduce((a,sv)=>{if(sv.confirmed){if(sv.a>sv.b)a.a++;else a.b++;}return a;},{a:0,b:0});
      if(sw.a<2&&sw.b<2&&sets.length<3)sK(mid,{...ko,sets:[...sets,{a:0,b:0}]});
      else sK(mid,{...ko,sets});
    };}
    else if(a==="submit-ko"){el.onclick=()=>{
      const mid=el.dataset.mid;const ko=gK(mid);
      const sw=ko.sets.reduce((a,sv)=>{if(sv.confirmed){if(sv.a>sv.b)a.a++;else a.b++;}return a;},{a:0,b:0});
      if(sw.a===sw.b)return;
      if(!confirm(`Submit match? Result will be LOCKED. Only admin can reset.`))return;
      sK(mid,{...ko,confirmed:true,live:false,scoredBy:refName});
    };}
  });
}
render();
</script>
<style>@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}</style>
</body>
</html>
